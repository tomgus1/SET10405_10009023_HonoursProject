name: Build fluttercalc

on:
  push:
    branches: [main]
    tags: ['fluttercalc-v*']
    paths:
      - 'calc/fluttercalc/**'
      - '.github/workflows/fluttercalc.yml'
  pull_request:
    paths:
      - 'calc/fluttercalc/**'
      - '.github/workflows/fluttercalc.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: calc/fluttercalc

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter test

      - run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          ../../.github/scripts/make-appimage.sh fluttercalc \
            build/linux/x64/release/bundle/flutter_calc \
            build/linux/x64/release/bundle \
            web/icons/Icon-512.png

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: fluttercalc-linux
          path: calc/fluttercalc/*.AppImage

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ..\..\.github\scripts\make-windows-installer.ps1 `
            -AppId fluttercalc `
            -SourceDir "build\windows\x64\runner\Release" `
            -ExeName flutter_calc.exe

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: fluttercalc-windows
          path: calc/fluttercalc/fluttercalc-setup.exe

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          ../../.github/scripts/make-macos-dmg.sh fluttercalc \
            --app "build/macos/Build/Products/Release/flutter_calc.app"

      - name: Upload macOS DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: fluttercalc-macos
          path: calc/fluttercalc/fluttercalc.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/fluttercalc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fluttercalc-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body: "Calculator app — Flutter/Dart."
          files: dist/**
