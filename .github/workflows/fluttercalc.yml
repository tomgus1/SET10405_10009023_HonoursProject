name: Build fluttercalc

on:
  push:
    branches: [main]
    paths:
      - 'calc/fluttercalc/**'
      - '.github/workflows/fluttercalc.yml'
  pull_request:
    paths:
      - 'calc/fluttercalc/**'
      - '.github/workflows/fluttercalc.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: calc/fluttercalc

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_path: build/linux/x64/release/bundle
          - os: windows-latest
            platform: windows
            artifact_path: build/windows/x64/runner/Release
          - os: macos-latest
            platform: macos
            artifact_path: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter test

      - run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          ../../.github/scripts/make-appimage.sh fluttercalc \
            build/linux/x64/release/bundle/flutter_calc \
            build/linux/x64/release/bundle \
            web/icons/Icon-512.png

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: fluttercalc-linux
          path: calc/fluttercalc/*.AppImage

      - name: Ad-hoc codesign macOS app
        if: matrix.platform == 'macos'
        run: codesign --force --deep --sign - "build/macos/Build/Products/Release/flutter_calc.app"

      - name: Upload build
        if: matrix.platform != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: fluttercalc-${{ matrix.platform }}
          path: calc/fluttercalc/${{ matrix.artifact_path }}
