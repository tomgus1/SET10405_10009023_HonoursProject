name: Build reactcalc

on:
  push:
    branches: [main]
    tags: ['reactcalc-v*']
    paths:
      - 'calc/reactcalc/**'
      - '.github/workflows/reactcalc.yml'
  pull_request:
    paths:
      - 'calc/reactcalc/**'
      - '.github/workflows/reactcalc.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: calc/reactcalc

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: desktop:package:linux
            platform: linux
          - os: windows-latest
            script: desktop:package:win
            platform: windows
          - os: macos-latest
            script: desktop:package:mac
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            calc/reactcalc/package-lock.json
            calc/reactcalc/electron/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: calc/reactcalc/electron

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: reactcalc-${{ matrix.platform }}
          path: |
            calc/reactcalc/electron/release/*.dmg
            calc/reactcalc/electron/release/*.exe
            calc/reactcalc/electron/release/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/reactcalc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reactcalc-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body: "Calculator app — React Native (Expo), packaged as a desktop app with Electron."
          files: dist/**
