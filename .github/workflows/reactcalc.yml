name: Build reactcalc

on:
  push:
    branches: [main]
    paths:
      - 'calc/reactcalc/**'
      - '.github/workflows/reactcalc.yml'
  pull_request:
    paths:
      - 'calc/reactcalc/**'
      - '.github/workflows/reactcalc.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: calc/reactcalc

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: desktop:package:linux
            platform: linux
          - os: windows-latest
            script: desktop:package:win
            platform: windows
          - os: macos-latest
            script: desktop:package:mac
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            calc/reactcalc/package-lock.json
            calc/reactcalc/electron/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: calc/reactcalc/electron

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: reactcalc-${{ matrix.platform }}
          path: calc/reactcalc/electron/release/**
