name: Build rustfwnotes

on:
  push:
    branches: [main]
    tags: ['rustfwnotes-v*']
    paths:
      - 'notes/rustfwnotes/**'
      - '.github/workflows/rustfwnotes.yml'
  pull_request:
    paths:
      - 'notes/rustfwnotes/**'
      - '.github/workflows/rustfwnotes.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: notes/rustfwnotes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin_suffix: ''
          - os: windows-latest
            bin_suffix: '.exe'
          - os: macos-latest
            bin_suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev make cmake clang lld llvm jq \
            gettext-base elfutils libsqlite3-dev build-essential pkg-config \
            pipewire xdg-desktop-portal libstdc++-12-dev

      - run: cargo test --release

      - run: cargo build --release

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: ../../.github/scripts/make-appimage.sh rustfwnotes target/release/notes-app

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rustfwnotes-linux
          path: notes/rustfwnotes/*.AppImage

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: ../../.github/scripts/make-macos-dmg.sh rustfwnotes --bin target/release/notes-app

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rustfwnotes-macos
          path: notes/rustfwnotes/rustfwnotes.dmg

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rustfwnotes-windows
          path: notes/rustfwnotes/target/release/notes-app${{ matrix.bin_suffix }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rustfwnotes-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rustfwnotes-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body: "Notes app — Rust, using a small hand-built GUI framework on top of GPUI (no third-party widget library)."
          files: dist/**
