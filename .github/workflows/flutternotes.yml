name: Build flutternotes

on:
  push:
    branches: [main]
    paths:
      - 'notes/flutternotes/**'
      - '.github/workflows/flutternotes.yml'
  pull_request:
    paths:
      - 'notes/flutternotes/**'
      - '.github/workflows/flutternotes.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: notes/flutternotes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_path: build/linux/x64/release/bundle
          - os: windows-latest
            platform: windows
            artifact_path: build/windows/x64/runner/Release
          - os: macos-latest
            platform: macos
            artifact_path: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter test

      - run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          ../../.github/scripts/make-appimage.sh flutternotes \
            build/linux/x64/release/bundle/notes_app \
            build/linux/x64/release/bundle \
            macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: flutternotes-linux
          path: notes/flutternotes/*.AppImage

      - name: Upload build
        if: matrix.platform != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: flutternotes-${{ matrix.platform }}
          path: notes/flutternotes/${{ matrix.artifact_path }}
