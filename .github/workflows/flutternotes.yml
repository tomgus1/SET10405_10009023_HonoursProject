name: Build flutternotes

on:
  push:
    branches: [main]
    tags: ['flutternotes-v*']
    paths:
      - 'notes/flutternotes/**'
      - '.github/workflows/flutternotes.yml'
  pull_request:
    paths:
      - 'notes/flutternotes/**'
      - '.github/workflows/flutternotes.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: notes/flutternotes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter test

      - run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          ../../.github/scripts/make-appimage.sh flutternotes \
            build/linux/x64/release/bundle/notes_app \
            build/linux/x64/release/bundle \
            macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: flutternotes-linux
          path: notes/flutternotes/*.AppImage

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ..\..\.github\scripts\make-windows-installer.ps1 `
            -AppId flutternotes `
            -SourceDir "build\windows\x64\runner\Release" `
            -ExeName notes_app.exe

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: flutternotes-windows
          path: notes/flutternotes/flutternotes-setup.exe

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: |
          ../../.github/scripts/make-macos-dmg.sh flutternotes \
            --app "build/macos/Build/Products/Release/notes_app.app"

      - name: Upload macOS DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: flutternotes-macos
          path: notes/flutternotes/flutternotes.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/flutternotes-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flutternotes-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
