name: Build reactnotes

on:
  push:
    branches: [main]
    paths:
      - 'notes/reactnotes/**'
      - '.github/workflows/reactnotes.yml'
  pull_request:
    paths:
      - 'notes/reactnotes/**'
      - '.github/workflows/reactnotes.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: notes/reactnotes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: desktop:package:linux
            platform: linux
          - os: windows-latest
            script: desktop:package:win
            platform: windows
          - os: macos-latest
            script: desktop:package:mac
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notes/reactnotes/package-lock.json

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: reactnotes-${{ matrix.platform }}
          path: notes/reactnotes/release/**
