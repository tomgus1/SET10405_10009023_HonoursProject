name: Build reactnotes

on:
  push:
    branches: [main]
    tags: ['reactnotes-v*']
    paths:
      - 'notes/reactnotes/**'
      - '.github/workflows/reactnotes.yml'
  pull_request:
    paths:
      - 'notes/reactnotes/**'
      - '.github/workflows/reactnotes.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: notes/reactnotes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: desktop:package:linux
            platform: linux
          - os: windows-latest
            script: desktop:package:win
            platform: windows
          - os: macos-latest
            script: desktop:package:mac
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notes/reactnotes/package-lock.json

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: reactnotes-${{ matrix.platform }}
          path: |
            notes/reactnotes/release/*.dmg
            notes/reactnotes/release/*.exe
            notes/reactnotes/release/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/reactnotes-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reactnotes-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body: "Notes app — React Native (Expo), packaged as a desktop app with Electron."
          files: dist/**
